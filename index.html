<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Exam Magic - Student Enrollment</title>
    <!-- Google Fonts for a mystical, premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c14;
            --bg-card: rgba(18, 22, 38, 0.75);
            --accent-glow: #8b5cf6;
            --accent-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(139, 92, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Mystical background ambient glow effects */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(10, 12, 20, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, rgba(10, 12, 20, 0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 560px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #fff 30%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(10, 12, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            background: rgba(10, 12, 20, 0.8);
        }

        select option {
            background-color: #121626;
            color: var(--text-main);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.5);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(139, 92, 246, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Status notification banner */
        #statusMessage {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        #statusMessage.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            display: block;
        }
        #statusMessage.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            display: block;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .container {
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Black Exam Magic</h1>
            <p>Master the dawn ritual of the morning window bird and unlock your hidden potential. Register below to secure your spot.</p>
        </div>

        <!-- 
          MAKE.COM WEBHOOK CONFIGURATION:
          Replace the `action` attribute below with your unique Make custom webhook URL 
          (e.g., https://hook.eu1.make.com/your-unique-webhook-hash-here)
        -->
        <form id="magicTrainingForm" action="https://hook.eu1.make.com/vqlfhrtxoixm6devqs0e5my53nwfl36n" method="POST">
            <div class="form-grid">
                <!-- First Name -->
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="e.g. Elena" required>
                </div>

                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="e.g. Vance" required>
                </div>

                <!-- Email -->
                <div class="form-group full-width">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="elena@example.com" required>
                </div>

                <!-- Address -->
                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="123 Ravenwood Lane, Suite 4B" required>
                </div>

                <!-- Phone Number -->
                <div class="form-group full-width">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 019-2834" required>
                </div>

                <!-- Skill Interested -->
                <div class="form-group full-width">
                    <label for="skillInterested">Skill Interested</label>
                    <select id="skillInterested" name="skillInterested" required>
                        <option value="" disabled selected>Select your primary focus...</option>
                        <option value="Dawn Window Synchronization">Dawn Window Synchronization</option>
                        <option value="Avian Coded Frequency Decoding">Avian Coded Frequency Decoding</option>
                        <option value="Early Morning Ritual Resonance">Early Morning Ritual Resonance</option>
                        <option value="Advanced Exam Magic Mastery">Advanced Exam Magic Mastery</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Begin Initiation</button>
            <div id="statusMessage"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('magicTrainingForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const webhookUrl = form.action;
            
            // Safety check for placeholder URL
            if (webhookUrl.includes('YOUR_MAKE_WEBHOOK_URL_HERE')) {
                statusMessage.className = 'error';
                statusMessage.textContent = 'Please replace the placeholder with your actual Make.com Webhook URL.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Transmitting...';
            statusMessage.style.display = 'none';

            // Gather form data into an object
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                skillInterested: document.getElementById('skillInterested').value,
                submittedAt: new Date().toISOString()
            };

            try {
                // Send data to Make.com Webhook via Fetch API
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    statusMessage.className = 'success';
                    statusMessage.textContent = 'Initiation request received successfully! Check your inbox soon.';
                    form.reset();
                } else {
                    throw new Error('Server returned an error status.');
                }
            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = 'Transmission failed. Please verify your webhook URL or try again later.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Begin Initiation';
            }
        });
    </script>
</body>
</html>
